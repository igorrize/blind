[workspace]
resolver = "3"
members = ["crates/blind-core", "crates/blind", "crates/blind-exec"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/igorrize/blind"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
wildcard_enum_match_arm = "deny"
