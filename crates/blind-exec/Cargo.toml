[package]
name = "blind-exec"
description = "Sandboxed executor for blind workers. Deliberately has no HTTP client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
blind-core = { path = "../blind-core" }
cap-std = "4.0.3"
fff-search = "0.11.0"
globset = "0.4.21"
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
