[package]
name = "blind"
description = "TUI harness with super-strict agents and sub-agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
blind-core = { path = "../blind-core" }
catppuccin = "2.9.1"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
toml = "1.2.1"
toml_edit = "0.25.20"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
